<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mets les jours de la semaine dans l’ordre !</title>
<style>
  :root{
    --ink:#344b54;
    --cream:#fffaf0;
    --outline:#b9cfcb;
    --yellow:#ffe3a3;
    --blue:#c8d9f6;
    --purple:#ddcdf3;
    --pink:#f5cedd;
    --mint:#bfe9df;
    --peach:#ffd6bf;
    --green:#d5efc2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:var(--ink)}
  body{
    background:
      radial-gradient(circle at 10% 18%,#ffe5a7 0 8px,transparent 9px),
      radial-gradient(circle at 91% 12%,#b8e8db 0 11px,transparent 12px),
      radial-gradient(circle at 86% 76%,#f7c9d0 0 8px,transparent 9px),
      var(--cream);
  }
  .app-shell{width:100%;min-height:100vh;padding:24px 14px 34px}
  main{max-width:1150px;margin:auto}
  header{text-align:center;margin-bottom:24px}
  .emoji-row{display:inline-flex;gap:8px;background:#ffffffd9;padding:10px 18px;border-radius:999px;box-shadow:0 3px 12px #00000010;margin-bottom:16px}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,5vw,62px);line-height:1.05;margin:0;max-width:900px;margin-inline:auto}
  .subtitle{font-size:clamp(16px,2vw,24px);font-weight:700;margin:16px auto 0;max-width:800px}
  .board{background:#fff;border-radius:30px;padding:24px;box-shadow:0 16px 48px #7a84671c}
  .topbar{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:26px}
  .score{display:inline-flex;align-items:center;gap:10px;background:#fff0ba;border-radius:18px;padding:14px 20px;font-size:18px;font-weight:800}
  .controls{display:flex;gap:10px;flex-wrap:wrap}
  button{font:inherit;color:inherit}
  .control{border:0;border-radius:16px;padding:13px 17px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px #0000000c}
  #sound-button{background:#dff1f9}
  #restart-button{background:#fde2e2}
  h2{font-size:clamp(22px,3vw,33px);margin:10px 0 14px}
  #card-tray,#slots{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
  #card-tray{margin-bottom:28px;min-height:78px}
  .day-card{
    border:0;border-radius:21px;padding:16px 8px;min-height:76px;font-size:clamp(16px,1.8vw,22px);
    font-weight:800;cursor:grab;touch-action:none;user-select:none;
    box-shadow:0 5px 0 #344b5420,0 8px 18px #344b5414;
    transition:transform .18s,box-shadow .18s,opacity .18s
  }
  .day-card:hover{transform:translateY(-3px)}
  .day-card.selected{outline:4px solid #344b54;outline-offset:3px;transform:translateY(-5px)}
  .day-card.drag-source{opacity:.35}
  .day-card:active{cursor:grabbing}
  .day-card[data-day="0"]{background:var(--peach)}
  .day-card[data-day="1"]{background:var(--yellow)}
  .day-card[data-day="2"]{background:var(--green)}
  .day-card[data-day="3"]{background:var(--mint)}
  .day-card[data-day="4"]{background:var(--blue)}
  .day-card[data-day="5"]{background:var(--purple)}
  .day-card[data-day="6"]{background:var(--pink)}
  .day-slot{
    min-height:110px;border:3px dashed var(--outline);background:#ffffffb8;border-radius:21px;padding:8px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;
    transition:background .18s,transform .18s,border-color .18s
  }
  .day-slot.hovered{background:#e7f7dc;border-color:#75b981;transform:scale(1.035)}
  .day-slot.filled{border-style:solid;border-color:#a5d9b6;background:#eef9e9}
  .day-slot .day-card{width:100%;min-height:67px;cursor:default;box-shadow:0 3px 0 #344b5420}
  .day-slot .day-card:hover{transform:none}
  .num{font-size:14px;font-weight:800;opacity:.6}
  .message{min-height:38px;text-align:center;font-weight:800;font-size:20px;margin:22px 0 0}
  footer{text-align:center;padding:20px 4px 0;font-weight:700}
  .drag-ghost{
    position:fixed;z-index:1000;pointer-events:none;display:grid;place-items:center;border-radius:21px;
    box-shadow:0 18px 35px #344b5440;font-size:22px;font-weight:800;padding:14px 22px;white-space:nowrap;
    transform:translate(-50%,-50%) rotate(-5deg)
  }
  .confetti-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1100}
  .confetti{position:absolute;top:-25px;width:12px;height:20px;border-radius:3px;animation:fall var(--duration) linear forwards;animation-delay:var(--delay)}
  @keyframes fall{to{transform:translate(var(--drift),100vh) rotate(850deg);opacity:0}}
  button:focus-visible{outline:4px solid #265d7b;outline-offset:4px}
  @media(max-width:900px){#card-tray,#slots{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:560px){
    .app-shell{padding:16px 10px 28px}
    .board{padding:16px}
    #card-tray,#slots{grid-template-columns:repeat(2,1fr)}
    .day-card{min-height:66px}
    .day-slot{min-height:90px}
    .controls{width:100%}
    .control{flex:1}
  }
  @media(prefers-reduced-motion:reduce){
    .confetti{animation-duration:.01ms!important}
    .day-card,.day-slot{transition:none}
  }
</style>
</head>
<body>
<div class="app-shell">
<main>
  <header>
    <div class="emoji-row" aria-hidden="true"><span>☀️</span><span>✏️</span><span>🌈</span></div>
    <h1>Mets les jours de la semaine dans l’ordre !</h1>
    <p class="subtitle">Écoute les jours, puis glisse chaque carte à sa bonne place !</p>
  </header>

  <section class="board" aria-label="Jeu des jours de la semaine">
    <div class="topbar">
      <div class="score"><span aria-hidden="true">⭐</span><span>Score :</span><strong id="score" aria-live="polite">0/7</strong></div>
      <div class="controls">
        <button id="sound-button" class="control" type="button" aria-pressed="true">🔊 Son activé</button>
        <button id="restart-button" class="control" type="button">🔄 Recommencer</button>
      </div>
    </div>

    <h2>Les cartes à ranger</h2>
    <div id="card-tray">
      <button type="button" class="day-card" data-day="0">Lundi</button>
      <button type="button" class="day-card" data-day="1">Mardi</button>
      <button type="button" class="day-card" data-day="2">Mercredi</button>
      <button type="button" class="day-card" data-day="3">Jeudi</button>
      <button type="button" class="day-card" data-day="4">Vendredi</button>
      <button type="button" class="day-card" data-day="5">Samedi</button>
      <button type="button" class="day-card" data-day="6">Dimanche</button>
    </div>

    <h2>Les places de lundi à dimanche</h2>
    <div id="slots">
      <button type="button" class="day-slot" data-slot="0" aria-label="Place 1, lundi"><span class="num">1</span></button>
      <button type="button" class="day-slot" data-slot="1" aria-label="Place 2, mardi"><span class="num">2</span></button>
      <button type="button" class="day-slot" data-slot="2" aria-label="Place 3, mercredi"><span class="num">3</span></button>
      <button type="button" class="day-slot" data-slot="3" aria-label="Place 4, jeudi"><span class="num">4</span></button>
      <button type="button" class="day-slot" data-slot="4" aria-label="Place 5, vendredi"><span class="num">5</span></button>
      <button type="button" class="day-slot" data-slot="5" aria-label="Place 6, samedi"><span class="num">6</span></button>
      <button type="button" class="day-slot" data-slot="6" aria-label="Place 7, dimanche"><span class="num">7</span></button>
    </div>

    <p id="feedback" class="message" role="status" aria-live="polite"></p>
  </section>

  <footer>Astuce : tu peux aussi cliquer sur une carte, puis cliquer sur sa place.</footer>
</main>
<div id="confetti-layer" class="confetti-layer" aria-hidden="true"></div>
</div>

<script>
const names = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const tray = document.getElementById("card-tray");
const cards = [...tray.querySelectorAll(".day-card")];
const slots = [...document.querySelectorAll(".day-slot")];
const score = document.getElementById("score");
const feedback = document.getElementById("feedback");
const soundButton = document.getElementById("sound-button");
let selected = null, muted = false, count = 0, audioContext = null, drag = null;

function speak(text){
  if(muted || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "fr-FR";
  utterance.rate = .83;
  const voices = speechSynthesis.getVoices();
  const french = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("fr"));
  if(french) utterance.voice = french;
  speechSynthesis.speak(utterance);
}

function notes(frequencies,gentle=false){
  if(muted) return;
  try{
    audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
    if(audioContext.state === "suspended") audioContext.resume();
    const start = audioContext.currentTime;
    frequencies.forEach((frequency,index)=>{
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = "sine";
      oscillator.frequency.value = frequency;
      const t = start + index * (gentle ? .18 : .13);
      gain.gain.setValueAtTime(.0001,t);
      gain.gain.exponentialRampToValueAtTime(gentle ? .075 : .13,t+.025);
      gain.gain.exponentialRampToValueAtTime(.0001,t+.24);
      oscillator.connect(gain).connect(audioContext.destination);
      oscillator.start(t);
      oscillator.stop(t+.25);
    });
  }catch(e){}
}

function clearSelection(){
  if(selected) selected.classList.remove("selected");
  selected = null;
}
function choose(card){
  if(card.closest(".day-slot")) return;
  speak(names[Number(card.dataset.day)]);
  if(selected===card){clearSelection();return;}
  clearSelection();
  selected=card;
  card.classList.add("selected");
  feedback.textContent="";
}
function celebrate(){
  const layer=document.getElementById("confetti-layer");
  layer.replaceChildren();
  const colors=["#ffbc73","#f3a9bb","#8bd1bc","#a4bae9","#f6dc7d"];
  for(let i=0;i<85;i++){
    const p=document.createElement("span");
    p.className="confetti";
    p.style.left=Math.random()*100+"%";
    p.style.background=colors[i%colors.length];
    p.style.setProperty("--drift",(Math.random()-.5)*250+"px");
    p.style.setProperty("--duration",(2.3+Math.random()*1.8)+"s");
    p.style.setProperty("--delay",(Math.random()*.8)+"s");
    layer.appendChild(p);
  }
  setTimeout(()=>layer.replaceChildren(),5000);
}
function place(card,slot){
  if(!card || !slot || card.closest(".day-slot") || slot.classList.contains("filled")) return;
  if(Number(card.dataset.day)!==Number(slot.dataset.slot)){
    feedback.textContent="Essaie encore ! 🌷";
    notes([330,294],true);
    speak("Essaie encore !");
    return;
  }
  clearSelection();
  card.classList.remove("drag-source");
  card.setAttribute("tabindex","-1");
  slot.appendChild(card);
  slot.classList.add("filled");
  slot.setAttribute("aria-label","Place "+(Number(slot.dataset.slot)+1)+" : "+names[Number(slot.dataset.slot)]+", bien placé");
  count++;
  score.textContent=count+"/7";
  if(count===7){
    feedback.textContent="Bravo ! Tu as réussi ! 🎉";
    notes([523,659,784,1047,1319]);
    speak("Bravo ! Tu as réussi !");
    celebrate();
  }else{
    feedback.textContent="Super ! Continue ! ⭐";
    notes([523,784]);
  }
}
function reset(){
  if("speechSynthesis" in window) speechSynthesis.cancel();
  clearSelection();
  if(drag && drag.ghost) drag.ghost.remove();
  drag=null;
  document.querySelectorAll(".hovered").forEach(el=>el.classList.remove("hovered"));
  document.getElementById("confetti-layer").replaceChildren();
  count=0;
  score.textContent="0/7";
  feedback.textContent="";
  slots.forEach((slot,index)=>{
    slot.classList.remove("filled");
    slot.setAttribute("aria-label","Place "+(index+1)+", "+names[index].toLowerCase());
  });
  const shuffled=[...cards];
  for(let i=shuffled.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
  }
  shuffled.forEach(card=>{
    card.classList.remove("drag-source","selected");
    card.removeAttribute("tabindex");
    tray.appendChild(card);
  });
}
cards.forEach(card=>{
  card.addEventListener("click",()=>{
    if(card.dataset.ignoreClick==="true"){card.dataset.ignoreClick="false";return;}
    choose(card);
  });
  card.addEventListener("pointerdown",event=>{
    if(card.closest(".day-slot") || event.button!==0) return;
    drag={card,startX:event.clientX,startY:event.clientY,active:false,ghost:null};
  });
});
document.addEventListener("pointermove",event=>{
  if(!drag) return;
  if(!drag.active && Math.hypot(event.clientX-drag.startX,event.clientY-drag.startY)>9){
    drag.active=true;
    clearSelection();
    const ghost=document.createElement("div");
    ghost.className="drag-ghost";
    ghost.textContent=names[Number(drag.card.dataset.day)];
    ghost.style.background=getComputedStyle(drag.card).backgroundColor;
    ghost.style.color=getComputedStyle(drag.card).color;
    document.body.appendChild(ghost);
    drag.ghost=ghost;
    drag.card.classList.add("drag-source");
  }
  if(!drag.active) return;
  event.preventDefault();
  drag.ghost.style.left=event.clientX+"px";
  drag.ghost.style.top=event.clientY+"px";
  document.querySelectorAll(".hovered").forEach(el=>el.classList.remove("hovered"));
  const target=document.elementFromPoint(event.clientX,event.clientY)?.closest(".day-slot");
  if(target && !target.classList.contains("filled")) target.classList.add("hovered");
},{passive:false});
function finishDrag(event){
  if(!drag) return;
  const current=drag;
  drag=null;
  if(!current.active) return;
  current.card.dataset.ignoreClick="true";
  current.ghost.remove();
  current.card.classList.remove("drag-source");
  document.querySelectorAll(".hovered").forEach(el=>el.classList.remove("hovered"));
  speak(names[Number(current.card.dataset.day)]);
  const slot=document.elementFromPoint(event.clientX,event.clientY)?.closest(".day-slot");
  if(slot) place(current.card,slot);
  setTimeout(()=>{current.card.dataset.ignoreClick="false";},350);
}
document.addEventListener("pointerup",finishDrag);
document.addEventListener("pointercancel",()=>{
  if(!drag) return;
  drag.ghost?.remove();
  drag.card.classList.remove("drag-source");
  drag=null;
  document.querySelectorAll(".hovered").forEach(el=>el.classList.remove("hovered"));
});
slots.forEach(slot=>slot.addEventListener("click",()=>place(selected,slot)));
document.getElementById("restart-button").addEventListener("click",reset);
soundButton.addEventListener("click",()=>{
  muted=!muted;
  if(muted && "speechSynthesis" in window) speechSynthesis.cancel();
  soundButton.setAttribute("aria-pressed",String(!muted));
  soundButton.textContent=muted ? "🔇 Son désactivé" : "🔊 Son activé";
});
reset();
</script>
</body>
</html>
